<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل الدخول - نظام الحضور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/icons/icon-192x192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        
        .container {
            max-width: 560px;
            width: 100%;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.6s ease;
        }
        
        .logo-section img {
            width: 100px;
            height: 100px;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            border-radius: 50%;
            object-fit: cover;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease;
        }
        
        .card-title {
            text-align: center;
            font-size: 1.25rem;
            color: #333;
            margin-bottom: 4px;
            font-weight: 700;
        }
        
        .card-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
            font-size: 0.82rem;
        }
        
        /* Tabs System */
        .tabs-container {
            margin-bottom: 10px;
        }
        
        .tab-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
        }
        
        .tab-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #64748b;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }
        
        .tab-btn i {
            font-size: 0.95rem;
        }
        
        .tab-btn:hover {
            color: #475569;
        }
        
        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Login Form Styles */
        .login-form {
            margin-bottom: 10px;
        }
        
        .form-title {
            text-align: center;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 3px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .form-title i {
            color: #667eea;
            font-size: 1.05rem;
        }
        
        #student-content .form-title i {
            color: #11998e;
        }
        
        .form-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 14px;
            font-size: 0.78rem;
        }
        
        .form-group {
            margin-bottom: 11px;
        }
        
        .form-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.82rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 5px;
        }
        
        .form-group label i {
            color: #667eea;
            font-size: 0.75rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 9px;
            font-size: 0.88rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input::placeholder {
            color: #94a3b8;
        }
        
        .submit-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 9px;
            font-size: 0.95rem;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
        }
        
        .submit-btn.teacher {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .submit-btn.teacher:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn.student {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.3);
        }
        
        .submit-btn.student:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(17, 153, 142, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .features {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 13px;
            margin-top: 14px;
        }
        
        .features h4 {
            color: #667eea;
            font-size: 0.82rem;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 800;
        }
        
        .features ul {
            list-style: none;
            padding: 0;
        }
        
        .features li {
            padding: 5px 0;
            color: #666;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        
        .features li i {
            color: #11998e;
            font-size: 0.75rem;
        }
        
        /* رسالة الخطأ */
        .error-alert {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff5f5;
            border: 1.5px solid #fc8181;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .error-alert i {
            font-size: 1.1rem;
            color: #e53e3e;
        }
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 500px) {
            .card {
                padding: 22px 20px;
            }
            
            .card-title {
                font-size: 1.2rem;
            }
            
            .form-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <img src="{{ logo_path }}" 
                 alt="Logo" 
                 style="border-radius:50% !important; object-fit:cover; width:100px; height:100px; background: white; border: 3px solid white;"
                 onerror="console.error('Logo error:', this.src); this.style.opacity='0.3'; this.src='/static/icons/icon-192x192.png';"
                 onload="console.log('Logo loaded:', this.src);">
        </div>
        
        <div class="card">
            <h2 class="card-title">مرحباً بك</h2>
            <p class="card-subtitle">اختر نوع الحساب لتسجيل الدخول</p>
            
            <!-- رسالة الخطأ إن وجدت -->
            {% if error_msg %}
            <div class="error-alert">
                <i class="fas fa-exclamation-circle"></i>
                {{ error_msg }}
            </div>
            {% endif %}
            
            <!-- Tabs للاختيار بين المدرس والطالب -->
            <div class="tabs-container">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="teacher">
                        <i class="fas fa-chalkboard-teacher"></i>
                        <span>مدرس / أستاذ</span>
                    </button>
                    <button class="tab-btn" data-tab="student">
                        <i class="fas fa-user-graduate"></i>
                        <span>طالب</span>
                    </button>
                </div>
                
                <!-- محتوى تسجيل دخول المدرس -->
                <div class="tab-content active" id="teacher-content">
                    <div class="login-form">
                        <h3 class="form-title">
                            <i class="fas fa-chalkboard-teacher"></i>
                            بوابة المدرس
                        </h3>
                        <p class="form-subtitle">إدارة الحضور والطلاب والمواد</p>
                        
                        <form action="/teacher/login" method="POST">
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> اسم المستخدم</label>
                                <input type="text" name="username" placeholder="أدخل اسم المستخدم" required>
                            </div>
                            
                            <div class="form-group">
                                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
                            </div>
                            
                            <button type="submit" class="submit-btn teacher">
                                <i class="fas fa-sign-in-alt"></i>
                                تسجيل الدخول
                            </button>
                        </form>
                    </div>
                </div>
                
                <!-- محتوى تسجيل دخول الطالب -->
                <div class="tab-content" id="student-content">
                    <div class="login-form">
                        <h3 class="form-title">
                            <i class="fas fa-user-graduate"></i>
                            بوابة الطالب
                        </h3>
                        <p class="form-subtitle">عرض الحضور والدرجات والبيانات</p>
                        
                        <form action="/student/login" method="POST">
                            <div class="form-group">
                                <label><i class="fas fa-id-card"></i> الرقم الجامعي</label>
                                <input type="text" name="student_id" placeholder="أدخل الرقم الجامعي" required>
                            </div>
                            
                            <div class="form-group">
                                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
                            </div>
                            
                            <button type="submit" class="submit-btn student">
                                <i class="fas fa-sign-in-alt"></i>
                                تسجيل الدخول
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="features">
                <h4>✨ مزايا النظام</h4>
                <ul>
                    <li><i class="fas fa-check-circle"></i> تسجيل الحضور بالـ QR</li>
                    <li><i class="fas fa-check-circle"></i> عرض السجلات والإحصائيات</li>
                    <li><i class="fas fa-check-circle"></i> إدارة الطلاب والمواد</li>
                    <li><i class="fas fa-check-circle"></i> نظام الدرجات الشامل</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => {
                console.log('Service Worker registered');
            });
        }
        
        // Tabs System
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            
            // فتح التبويبة الصحيحة (عند وجود خطأ يرجع لنفس التبويبة)
            const activeTab = "{{ active_tab | default('teacher') }}";
            tabButtons.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));
            
            const targetBtn = document.querySelector(`[data-tab="${activeTab}"]`);
            const targetContent = document.getElementById(activeTab + '-content');
            if (targetBtn) targetBtn.classList.add('active');
            if (targetContent) targetContent.classList.add('active');
            
            // حدث الضغط على التبويبات
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const tabName = this.getAttribute('data-tab');
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(tabName + '-content').classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
